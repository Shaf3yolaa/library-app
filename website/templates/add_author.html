{% extends "layout.html" %}{% block content %}<div class="form-card"><div class="eyebrow">New record</div><h1>Add an author</h1><p class="intro">Create an author profile with a photo and basic information.</p><form method="POST" enctype="multipart/form-data"><div class="field"><label>AUTHOR NAME</label><input name="name" value="{{ form.name }}" placeholder="e.g. Naguib Mahfouz" required></div><div class="field"><label>COUNTRY</label><input name="country" value="{{ form.country }}" placeholder="e.g. Egypt" required></div><div class="field"><label>AUTHOR PHOTO</label><div class="file-box"><input type="file" name="image" accept="image/png,image/jpeg,image/webp,image/gif" onchange="previewImage(this,'authorPreview')"><img id="authorPreview" class="preview" src="{{ url_for('static',filename='background.jpeg') }}"></div></div><div class="form-actions"><button class="primary-btn flex-grow-1" type="submit">Save Author</button><a class="secondary-btn" href="{{ url_for('library') }}">Cancel</a></div></form></div>{% endblock %}
