{% extends "layout.html" %}{% block content %}<div class="form-card"><div class="eyebrow">Edit record · #{{ author.author_id }}</div><h1>Update author</h1><p class="intro">Change the details or replace the current author photo.</p><form method="POST" enctype="multipart/form-data"><div class="field"><label>AUTHOR NAME</label><input name="name" value="{{ author.name }}" required></div><div class="field"><label>COUNTRY</label><input name="country" value="{{ author.country }}" required></div><div class="field"><label>REPLACE PHOTO <span class="sub">Leave empty to keep the current photo.</span></label><div class="file-box"><input type="file" name="image" accept="image/png,image/jpeg,image/webp,image/gif" onchange="previewImage(this,'authorPreview')">{% if author.image_path %}<img id="authorPreview" class="preview" src="{{ url_for('static',filename=author.image_path) }}">{% else %}<div id="authorPreview" class="preview" style="display:grid;place-items:center">No photo</div>{% endif %}</div></div><div class="form-actions"><button class="primary-btn flex-grow-1" type="submit">Save Changes</button><a class="secondary-btn" href="{{ url_for('library') }}">Cancel</a></div></form></div>{% endblock %}
