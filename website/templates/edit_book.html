{% extends "layout.html" %}{% block content %}<div class="form-card"><div class="eyebrow">Edit record · #{{ book.book_id }}</div><h1>Update book</h1><p class="intro">Edit the details or replace the current book cover.</p><form method="POST" enctype="multipart/form-data"><div class="field"><label>BOOK TITLE</label><input name="title" value="{{ book.title }}" required></div><div class="field"><label>PRICE ($)</label><input type="number" step="0.01" min="0" name="price" value="{{ book.price }}" required></div><div class="field"><label>AUTHOR</label><select name="author_id" required>{% for a in authors %}<option value="{{ a.author_id }}" {% if a.author_id == book.author_id %}selected{% endif %}>{{ a.name }}</option>{% endfor %}</select></div><div class="field"><label>REPLACE COVER <span class="sub">Leave empty to keep the current cover.</span></label><div class="file-box"><input type="file" name="image" accept="image/png,image/jpeg,image/webp,image/gif" onchange="previewImage(this,'bookPreview')">{% if book.image_path %}<img id="bookPreview" class="preview" src="{{ url_for('static',filename=book.image_path) }}">{% else %}<div id="bookPreview" class="preview" style="display:grid;place-items:center">No cover</div>{% endif %}</div></div><div class="form-actions"><button class="primary-btn flex-grow-1" type="submit">Save Changes</button><a class="secondary-btn" href="{{ url_for('library') }}">Cancel</a></div></form></div>{% endblock %}
