{% extends "layout.html" %}{% block content %}<div class="auth-shell"><div class="auth-card"><div class="auth-logo">L</div><div class="eyebrow">Get started</div><h1>Create account.</h1><p class="hint">Your entered data stays here if validation fails.</p><form method="POST"><div class="field"><label>FULL NAME</label><input type="text" name="name" value="{{ form.name }}" placeholder="Your name" required></div><div class="field"><label>EMAIL</label><input type="email" name="email" value="{{ form.email }}" placeholder="you@example.com" required></div><div class="field"><label>PASSWORD</label><div class="password-wrap"><input type="password" name="password" id="registerPassword" value="{{ form.password }}" required><button type="button" onclick="togglePassword('registerPassword',this)">Show</button></div></div><div class="field"><label>CONFIRM PASSWORD</label><div class="password-wrap"><input type="password" name="confirm_password" id="registerConfirmPassword" value="{{ form.confirm_password }}" required><button type="button" onclick="togglePassword('registerConfirmPassword',this)">Show</button></div></div><button class="primary-btn w-100 mt-2" type="submit">Create account →</button></form><div class="auth-link">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></div></div></div>{% endblock %}
