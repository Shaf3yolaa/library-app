<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<nav class="topbar">
    <a href="{{ url_for('library') if session.get('user_id') else url_for('login') }}" class="brand"><span class="brand-mark">L</span><span>LIBRARY<span class="brand-soft">.STUDIO</span></span></a>
    <div class="nav-actions">
        {% if session.get('user_id') %}<span class="user-chip">{{ session.get('name', 'User') }}</span><a href="{{ url_for('logout') }}" class="ghost-btn">Log out</a>{% endif %}
        <button id="themeToggle" class="ghost-btn" type="button">☀️</button>
    </div>
</nav>
<main class="page-shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ 'flash-success' if category == 'success' else 'flash-error' }}" data-auto-dismiss>{{ message }}<button type="button" onclick="this.parentElement.remove()">×</button></div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
<script>
const html=document.documentElement, toggle=document.getElementById('themeToggle');
const saved=localStorage.getItem('theme')||'dark'; html.dataset.bsTheme=saved; toggle.textContent=saved==='dark'?'☀️':'🌙';
toggle.onclick=()=>{const n=html.dataset.bsTheme==='dark'?'light':'dark';html.dataset.bsTheme=n;localStorage.setItem('theme',n);toggle.textContent=n==='dark'?'☀️':'🌙'};
document.querySelectorAll('[data-auto-dismiss]').forEach(x=>setTimeout(()=>x.remove(),4500));
function togglePassword(id,btn){const el=document.getElementById(id);el.type=el.type==='password'?'text':'password';btn.textContent=el.type==='password'?'Show':'Hide'}
function previewImage(input,target){const file=input.files&&input.files[0];if(!file)return;const img=document.getElementById(target);img.src=URL.createObjectURL(file);img.classList.add('has-preview')}
</script>
</body></html>
