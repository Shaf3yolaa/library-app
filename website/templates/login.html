{% extends "layout.html" %}{% block content %}<div class="auth-shell"><div class="auth-card"><div class="auth-logo">L</div><div class="eyebrow">Welcome back</div><h1>Sign in.</h1><p class="hint">Access your personal library workspace.</p><form method="POST"><div class="field"><label>EMAIL</label><input type="email" name="email" value="{{ email }}" placeholder="you@example.com" required></div><div class="field"><label>PASSWORD</label><div class="password-wrap"><input type="password" name="password" id="loginPassword" required><button type="button" onclick="togglePassword('loginPassword',this)">Show</button></div></div><button class="primary-btn w-100 mt-2" type="submit">Sign in →</button></form><div class="auth-link">New here? <a href="{{ url_for('register') }}">Create an account</a></div></div></div>{% endblock %}
